<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Quiz | Premium Experience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container login-container">
    <div class="text-center mb-4">
        <i class="fa-solid fa-crown gold-text" style="font-size: 48px; margin-bottom: 15px;"></i>
        <h1 class="gold-text">Nexus Quiz</h1>
        <p style="color: var(--text-secondary);">Enter the arena of knowledge</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <div id="login-form" class="tab-content active">
        <div class="form-group">
            <label><i class="fa-solid fa-user"></i> Username</label>
            <input type="text" id="l-username" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-lock"></i> Password</label>
            <input type="password" id="l-password" placeholder="Enter your password">
        </div>
        <button onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Login to Account</button>
        <p id="l-error" class="text-center mt-4" style="color:var(--danger); font-weight: 500;"></p>
    </div>

    <div id="register-form" class="tab-content">
        <div class="form-group">
            <label><i class="fa-solid fa-user"></i> Choose Username</label>
            <input type="text" id="r-username" placeholder="Pick a unique username">
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-lock"></i> Create Password</label>
            <input type="password" id="r-password" placeholder="Must be strong">
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-shield-halved"></i> Role (Demo Mode)</label>
            <select id="r-role">
                <option value="USER">Player (User)</option>
                <option value="ADMIN">Quizmaster (Admin)</option>
            </select>
        </div>
        <button onclick="register()"><i class="fa-solid fa-user-plus"></i> Create Account</button>
        <p id="r-msg" class="text-center mt-4" style="font-weight: 500;"></p>
    </div>
</div>

<script src="app.js"></script>
<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if(tabId === 'login') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('login-form').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('register-form').classList.add('active');
        }
    }

    async function login() {
        const u = document.getElementById('l-username').value;
        const p = document.getElementById('l-password').value;
        const res = await fetch(`${API_URL}/user/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        });
        if(res.ok) {
            const data = await res.json();
            setToken(data.token, data.role, data.id);
            if(data.role === 'ADMIN') window.location.href = 'admin.html';
            else window.location.href = 'dashboard.html';
        } else {
            document.getElementById('l-error').innerText = 'Invalid credentials. Please try again.';
        }
    }

    async function register() {
        const u = document.getElementById('r-username').value;
        const p = document.getElementById('r-password').value;
        const role = document.getElementById('r-role').value;
        const res = await fetch(`${API_URL}/user/register`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p, role: role})
        });
        if(res.ok) {
            document.getElementById('r-msg').innerText = 'Registration successful! You can now login.';
            document.getElementById('r-msg').style.color = 'var(--success)';
            setTimeout(() => switchTab('login'), 1500);
        } else {
            const err = await res.text();
            document.getElementById('r-msg').innerText = err;
            document.getElementById('r-msg').style.color = 'var(--danger)';
        }
    }
</script>
</body>
</html>
